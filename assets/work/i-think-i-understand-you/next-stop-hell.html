<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="LOBSTER + SUBWAY + STRANGER = HELL. An interactive diptych about public space and private discomfort."><title>Next stop, HELL</title>
<style>
:root{--paper:#e9e7de;--ink:#20211e;--red:#ee402d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1500px;margin:auto;padding:24px 38px 18px}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:13px;font:11px monospace;letter-spacing:.08em}.heading{display:flex;align-items:end;justify-content:space-between;padding:22px 0 20px}h1{font-size:clamp(30px,4.2vw,64px);line-height:.9;letter-spacing:-.065em;margin:0;font-weight:900}h1 span{color:var(--red)}.formula{font:12px monospace;text-align:right;line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px;margin:auto}.caption{display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.07em;padding-bottom:8px}.art{width:100%;height:auto;aspect-ratio:500/560;max-height:53vh;min-height:0;display:block;background:var(--paper);border:0;cursor:crosshair;touch-action:manipulation}svg text{font-family:Arial,Helvetica,sans-serif;font-weight:900}.art .scene{transition:transform .4s}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px;margin:18px auto 0}.meter-top{display:flex;justify-content:space-between;font:11px monospace}.track{display:flex;align-items:center;gap:12px;margin-top:10px}input{width:100%;accent-color:var(--red);cursor:pointer}button{border:1px solid var(--ink);background:transparent;font:12px monospace;padding:13px 18px;cursor:pointer;color:var(--ink)}button:hover{background:var(--ink);color:var(--paper)}button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:4px}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;align-items:center}.add{background:var(--ink);color:var(--paper);flex:1}.add:hover{background:var(--red);color:var(--ink)}.hint{font:11px monospace;line-height:1.5;margin:12px auto 0;max-width:1100px;color:#585952}footer{display:flex;justify-content:space-between;margin-top:22px;border-top:1px solid;padding-top:12px;font:10px monospace}.status{color:var(--red)}@media(max-width:650px){main{padding:18px 14px}.heading{display:block;padding:22px 0 16px}.formula{text-align:left;font-size:10px;margin-top:12px}.pair{gap:8px}.art{height:auto;min-height:0}.caption{font-size:8px;letter-spacing:0}.caption span:last-child{display:none}.controls{grid-template-columns:1fr;gap:10px;margin-top:12px}header{font-size:9px}footer{font-size:8px;gap:20px;margin-top:16px}.hint{font-size:10px}.actions button{padding:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
header,footer{justify-content:flex-end}.heading{display:block}.formula{margin-top:22px;padding:14px 0;font:900 clamp(20px,2.6vw,36px)/1.2 Arial,Helvetica,sans-serif;letter-spacing:-.04em;text-align:left}.formula span{white-space:nowrap}.formula strong{color:var(--red)}.caption span:first-child{display:inline}@media(max-width:650px){.formula{font-size:20px;margin-top:18px;line-height:1.35}}
</style></head>
<body><main>
<header><span>WORD → WORLD / 2026</span></header>
<div class="heading"><h1><span>NEXT STOP</span></h1><div class="formula"><span>LOBSTER + SUBWAY</span> <span>+ STRANGER = <strong>HELL</strong></span></div></div>
<section class="pair" aria-label="Two synchronized compositions">
<div><div class="caption"><span>01 / TYPOGRAPHIC COMPOSITION</span></div><svg id="typeArt" class="art" viewBox="0 0 500 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Typographic composition: strangers crowd around the word lobster"><rect class="back" width="500" height="560" fill="#e9e7de"/><g id="typeScene"></g></svg></div>
<div><div class="caption"><span>02 / IMAGE-BASED COMPOSITION</span></div><svg id="imageArt" class="art" viewBox="0 0 500 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Geometric subway composition: strangers surround a red lobster"><defs><g id="person"><circle cy="-43" r="21"/><path d="M-32 60V0Q-32-16-16-16H16Q32-16 32 0V60Z"/><circle class="eye" cx="-7" cy="-44" r="3" fill="#e9e7de"/><circle class="eye" cx="7" cy="-44" r="3" fill="#e9e7de"/></g><g id="lobster" fill="#ee402d"><path d="M-13-40H13L22 16 14 52H-14L-22 16Z"/><path d="M-14 50L-35 73 0 65 35 73 14 50Z"/><path d="M-18-17L-47-40-55-73-46-89-42-65-32-83-27-67-34-45-10-30Z"/><path d="M18-17L47-40 55-73 46-89 42-65 32-83 27-67 34-45 10-30Z"/><g fill="none" stroke="#ee402d" stroke-width="6"><path d="M-15-4L-42 5M-16 13L-40 24M-15 29L-33 43M15-4L42 5M16 13L40 24M15 29L33 43M-7-37L-21-59M7-37L21-59"/></g><path d="M-17 7H17M-17 23H17M-14 39H14" stroke="#20211e" stroke-width="3"/></g></defs><rect class="back" width="500" height="560" fill="#e9e7de"/><g id="imageScene"></g></svg></div>
</section>
<section class="controls" aria-label="Crowding controls"><div><div class="meter-top"><label for="crowd">STRANGERS <span id="count">04</span> / 32</label><span id="status" class="status" aria-live="polite">A LITTLE AWKWARD</span></div><div class="track"><span aria-hidden="true">−</span><input id="crowd" type="range" min="0" max="32" value="4" aria-label="Number of strangers"><span aria-hidden="true">+</span></div></div><div class="actions"><button class="add" id="add">+ LET A STRANGER IN</button><button id="reset" aria-label="Reset to four strangers">↺ RESET</button></div></section>
<footer><span id="station">NEXT STOP / DISCOMFORT</span></footer>
</main>
<script>
const $=id=>document.getElementById(id), ink='#20211e',paper='#e9e7de',red='#ee402d';let n=4;
const positions=[];for(let row=0;row<4;row++)for(let col=0;col<8;col++){positions.push({x:29.5+col*63,y:150+row*115,row,col})}
// Outer seats fill first; the same coordinate system drives words and people.
positions.sort((a,b)=>Math.abs(b.x-250)-Math.abs(a.x-250)||a.row-b.row);
function render(){let hell=n>=28,p=n/32,fg=ink,bg=hell?red:paper;document.querySelectorAll('.back').forEach(el=>el.setAttribute('fill',bg));
let type=`<text x="18" y="52" font-size="54" letter-spacing="-4" fill="${fg}">SUBWAY SUBWAY</text><text x="18" y="545" font-size="54" letter-spacing="-4" fill="${fg}">SUBWAY SUBWAY</text>`;
let im=`<g fill="none" stroke="${fg}" stroke-width="5"><path d="M-10 61H510M-10 510H510M24 61V510M476 61V510M171 61V510M329 61V510"/><rect x="42" y="85" width="110" height="98" rx="22"/><rect x="348" y="85" width="110" height="98" rx="22"/><path d="M171 204H329M250 61V204"/></g><g fill="${fg}"><rect x="0" y="478" width="170" height="17"/><rect x="330" y="478" width="170" height="17"/></g>`;
positions.slice(0,n).sort((a,b)=>a.y-b.y).forEach((pt,i)=>{let x=pt.x+(250-pt.x)*p*.16,y=pt.y;type+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 ${x} ${y})" textLength="105" lengthAdjust="spacingAndGlyphs" font-size="${23+p*15}" fill="${fg}">STRANGER</text>`;im+=`<use href="#person" transform="translate(${x} ${y}) scale(${.72+p*.3} 1)" fill="${fg}"/>`});
let s=1-p*.28;type+=`<g transform="translate(250 302) rotate(${-p*12}) scale(${s} 1)"><text x="0" y="0" text-anchor="middle" font-size="79" letter-spacing="-6" fill="${hell?paper:red}">LOBSTER</text></g>`;
im+=`<g transform="translate(250 287) rotate(${-p*12}) scale(${1.05-p*.2})"><path d="M-64 14Q0-17 64 14V36H-64Z" fill="${paper}" stroke="${ink}" stroke-width="4"/><use href="#lobster"/><path d="M-64 44H64Q51 65 0 65Q-51 65-64 44Z" fill="${paper}" stroke="${ink}" stroke-width="4"/></g>`;
if(hell){type+=`<text x="250" y="410" text-anchor="middle" font-size="151" letter-spacing="-12" fill="${paper}">HELL</text>`;im+=`<g stroke="${paper}" stroke-width="9" fill="none"><path d="M20 255L93 287 20 320M480 255L407 287 480 320M206 23L250 66 294 23M206 537L250 494 294 537"/></g>`}
$('typeScene').innerHTML=type;$('imageScene').innerHTML=im;$('count').textContent=String(n).padStart(2,'0');$('crowd').value=n;$('status').textContent=hell?'WELCOME TO HELL':n>=20?'NO PERSONAL SPACE':n>=10?'EVERYONE IS LOOKING':n?'A LITTLE AWKWARD':'ROOM TO BREATHE';$('station').textContent=hell?'FINAL STOP / HELL':'NEXT STOP / DISCOMFORT';$('add').disabled=n===32;$('add').textContent=n===32?'CAPACITY EXCEEDED':'+ LET A STRANGER IN';}
function add(){n=Math.min(32,n+1);render()}$('add').onclick=add;$('typeArt').onclick=add;$('imageArt').onclick=add;$('crowd').oninput=e=>{n=+e.target.value;render()};$('reset').onclick=()=>{n=4;render()};render();
</script></body></html>
